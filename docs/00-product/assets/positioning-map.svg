<text x="635.0" y="680" fill="#a1a1aa" font-size="13" text-anchor="middle">Masked</text>
<text x="1150" y="680" fill="#a1a1aa" font-size="13" text-anchor="end">Still answered, on your own hardware</text>
<text x="635.0" y="708" fill="#f4f4f5" font-size="15" font-weight="600" text-anchor="middle">What happens to a sensitive question  →</text>
