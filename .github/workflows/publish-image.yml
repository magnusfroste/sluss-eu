name: publish-image

# Builds the router image and pushes it to GitHub Container Registry so the
# deploy compose (deploy/docker-compose.yml) can pull a prebuilt image instead
# of building on the host. Runs on pushes to main and on version tags.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build time
        id: when
        # head_commit.timestamp is empty for some merge events; the commit's
        # own timestamp is always there.
        run: echo "ts=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamp the commit into the binary so a deployed instance can show
          # which build it runs (sluss_build_info on /metrics, console footer).
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.when.outputs.ts }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
