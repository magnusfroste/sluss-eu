<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title id="t">Where Sluss sits among the alternatives</title>
<desc id="d">A map with two axes. Left to right: what happens to a sensitive question, from stopped, through masked, to still answered on your own hardware. Bottom to top: who is in control, from the vendor's cloud with a closed engine to your own servers with rules you can read. Network gateways and AI security specialists sit bottom left. AI gateways sit in the middle. European sovereign platforms sit upper middle. Sluss sits top right.</desc>
<rect width="1200" height="800" fill="#09090b"/>
<text x="120" y="52" fill="#f4f4f5" font-size="26" font-weight="700">Where Sluss sits among the alternatives</text>
<text x="120" y="80" fill="#a1a1aa" font-size="15">What happens to a sensitive question, and who is in control of the decision</text>
<rect x="120" y="110" width="1030" height="540" fill="#18181b" stroke="#27272a"/>
<rect x="635.0" y="110" width="515.0" height="270.0" fill="#3fb27f" fill-opacity="0.08"/>
<line x1="635.0" y1="110" x2="635.0" y2="650" stroke="#27272a" stroke-dasharray="4 6"/>
<line x1="120" y1="380.0" x2="1150" y2="380.0" stroke="#27272a" stroke-dasharray="4 6"/>
<text x="134" y="134" fill="#a1a1aa" font-size="12.5" letter-spacing=".06em" text-anchor="start">YOUR CONTROL · THE QUESTION IS STOPPED OR MASKED</text>
<text x="1136" y="134" fill="#3fb27f" font-size="12.5" letter-spacing=".06em" text-anchor="end">YOUR CONTROL · PEOPLE KEEP WORKING</text>
<text x="134" y="636" fill="#a1a1aa" font-size="12.5" letter-spacing=".06em" text-anchor="start">VENDOR'S CLOUD · THE QUESTION IS STOPPED OR MASKED</text>
<text x="1136" y="636" fill="#a1a1aa" font-size="12.5" letter-spacing=".06em" text-anchor="end">VENDOR'S CLOUD · PEOPLE KEEP WORKING</text>
