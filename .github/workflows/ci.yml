name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The exact toolchain go.mod names, so CI tests what the image ships.
          go-version-file: go.mod
          cache: true
      - name: vet
        run: go vet ./...
      - name: known vulnerabilities (govulncheck)
        # Fails on a vulnerability that the code actually calls, in the
        # standard library or a dependency. Keeping the Go patch level
        # current in go.mod is the usual fix.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: gofmt
        run: |
          out=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$out" ]; then
            echo "gofmt issues:"; echo "$out"; exit 1
          fi
      - name: secret scan (ISSUE-112)
        run: bash scripts/check-secrets.sh
      - name: test
        run: go test ./... -race -count=1
      - name: eval smoke
        run: make test-eval
      - name: policy tests
        run: make test-policy
      - name: use cases (every rule outcome, end-to-end vs mock)
        run: make use-cases
      - name: benchmark (444 labelled questions; rules, and rules + recorded second opinion)
        run: make benchmark
      - name: ciso demo (end-to-end vs mock)
        run: make demo-ciso
      - name: eval report
        run: make eval-report
      - name: upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report/
          if-no-files-found: error
