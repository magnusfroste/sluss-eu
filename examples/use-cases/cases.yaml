# Use cases: people and agents asking Sluss real questions, and what Sluss
# must do with each under examples/use-cases/policy.yaml. `make use-cases`
# runs every case against a fresh instance with test providers and fails if
# one outcome differs. Everything is synthetic.
#
# outcome: cloud | local | mask | block
#   cloud — answered by a cloud model, sent as it is
#   local — answered by a model on your own hardware
#   mask  — answered by a cloud model, identifiers replaced by placeholders
#   block — answered by no model; the person is told why
# classes: data classes Sluss must find (all of them must be present)
# masked:  for mask, the types that must be replaced
cases:
  - id: marketing-post
    who: Marketing
    story: A harmless request is sent to a cheap cloud model. Nothing to protect, so nothing is held back.
    prompt: Write a short LinkedIn post announcing our new office in Malmö.
    outcome: cloud

  - id: developer-commit
    who: Developer
    story: Everyday coding help goes to the cloud as usual.
    prompt: Write a git commit message for this diff that renames getUser to fetchUser.
    outcome: cloud

  - id: developer-pasted-key
    who: Developer
    story: A developer pastes a config with a live key while debugging. The key is caught as a value, not because the word "key" appears, and the question stays on your own hardware.
    prompt: "Why does this fail?\nAWS_REGION=eu-north-1\naws_secret_access_key = wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
    outcome: local
    classes: [secrets_possible]

  - id: support-ticket
    who: Customer support
    story: Support wants a good cloud model for an everyday ticket. Mask and send gives cloud quality while the customer's number, e-mail and phone never leave the house.
    prompt: Summarise this support ticket from customer 811218-9876 (anna.svensson@example.com, 070-123 45 67) about a delayed refund.
    outcome: mask
    classes: [pii]
    masked: [personnummer, email, phone]

  - id: support-high-risk
    who: Customer support
    story: Mask and send allows the cloud; it does not force it. This open-ended request is rated high risk and needs a premium model, and here the only premium model is the one on your own hardware, so the question stays local and nothing needs masking.
    prompt: Draft a friendly reply to customer 811218-9876 (anna.svensson@example.com, 070-123 45 67) about the delayed refund.
    outcome: local
    classes: [pii]

  - id: support-international
    who: Customer support
    story: Phone numbers come in many formats; each is found and masked.
    prompt: Summarise the call notes and confirm the callback number +44 20 7946 0958 and (555) 123-4567.
    outcome: mask
    classes: [pii]
    masked: [phone]

  - id: hr-sick-leave
    who: HR
    story: Personal data together with health data. The stricter rule wins, so the question stays on your own hardware instead of being masked.
    prompt: Erik Larsson, 811218-9876, has been on sick leave since March with burnout. Draft a plan for his return.
    outcome: local
    classes: [pii, health]

  - id: finance-quarterly
    who: Finance
    story: Results before publication stay in the house.
    prompt: Here is the balance sheet and P&L for Q3 before the earnings release; write the summary for the board.
    outcome: local
    classes: [financial]

  - id: finance-invoice-iban
    who: Finance
    story: An IBAN on an invoice is personal data, found even when written in groups of four. It is masked before the cloud.
    prompt: Summarise this invoice note in two lines; payment goes to SE45 5000 0000 0583 9825 7466.
    outcome: mask
    classes: [pii]
    masked: [iban]

  - id: legal-nda
    who: Legal
    story: Contracts stay on your own hardware.
    prompt: Review this NDA and the indemnification clause before we sign.
    outcome: local
    classes: [legal]

  - id: defence-classified
    who: Defence supplier
    story: Material marked under the Swedish security protection act is blocked outright, even when it also mentions a key that another rule would keep local. No model answers.
    prompt: HEMLIG enligt säkerhetsskyddslagen. Sammanfatta lägesbilden; API-nyckeln till ledningssystemet står i bilagan.
    outcome: block

  - id: lower-case-is-prose
    who: Anyone
    story: Precision matters as much as recall. Lower-case everyday words are not a classification stamp.
    prompt: Det är ingen hemlighet att vi vill växa; skriv en hemlig önskelista till julfesten.
    outcome: cloud

  - id: date-is-not-a-phone
    who: Logistics
    story: A date and an order number are not personal data.
    prompt: Mötet flyttas till 08-11-2024; ordernummer 0812-345 678 är levererat. Skriv ett kort mejl om det.
    outcome: cloud

  - id: agent-destructive-tool
    who: An AI agent
    story: An agent declares a tool that can delete data. Policy keeps it off the cloud, before any model sees the prompt.
    prompt: Clean up the staging database tables older than 90 days.
    tools: [drop_table, delete_rows]
    outcome: local

  - id: agent-read-only
    who: An AI agent
    story: An agent with read-only tools works as usual.
    prompt: Find the three most recent release notes and summarise them.
    tools: [search_docs, read_file]
    outcome: cloud
